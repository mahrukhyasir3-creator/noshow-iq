<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NoShowIQ</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; background: #f5f5f5; }
        h1 { color: #2c3e50; text-align: center; }
        .form-group { margin: 15px 0; }
        label { font-weight: bold; display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #2980b9; }
        #result { margin-top: 20px; padding: 20px; border-radius: 8px; display: none; }
        .high { background: #fadbd8; border: 2px solid #e74c3c; }
        .medium { background: #fef9e7; border: 2px solid #f39c12; }
        .low { background: #d5f5e3; border: 2px solid #27ae60; }
    </style>
</head>
<body>
    <h1>🏥 NoShowIQ</h1>
    <p style="text-align:center">Patient No-Show Risk Predictor</p>

    <div class="form-group">
        <label>Age:</label>
        <input type="number" id="age" value="35">
    </div>
    <div class="form-group">
        <label>Days in Advance (booking se kitne din pehle):</label>
        <input type="number" id="days" value="7">
    </div>
    <div class="form-group">
        <label>SMS Received? (1=Yes, 0=No):</label>
        <input type="number" id="sms" value="1" min="0" max="1">
    </div>
    <div class="form-group">
        <label>Hypertension? (1=Yes, 0=No):</label>
        <input type="number" id="hypertension" value="0" min="0" max="1">
    </div>
    <div class="form-group">
        <label>Scholarship? (1=Yes, 0=No):</label>
        <input type="number" id="scholarship" value="0" min="0" max="1">
    </div>

    <button onclick="predict()">Predict Risk</button>

    <div id="result">
        <h2 id="risk"></h2>
        <p id="prob"></p>
        <p id="rec"></p>
    </div>
<script>
    async function predict() {
        const data = {
            age: parseInt(document.getElementById('age').value),
            days_in_advance: parseInt(document.getElementById('days').value),
            sms_received: parseInt(document.getElementById('sms').value),
            hypertension: parseInt(document.getElementById('hypertension').value),
            scholarship: parseInt(document.getElementById('scholarship').value),
        };
        try {
            const resp = await fetch('/predict', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            const result = await resp.json();
            const div = document.getElementById('result');
            div.className = result.risk_level;
            div.style.display = 'block';
            document.getElementById('risk').innerText = 'Risk: ' + result.risk_level.toUpperCase();
            document.getElementById('prob').innerText = 'Probability: ' + (result.no_show_probability * 100).toFixed(1) + '%';
            document.getElementById('rec').innerText = result.recommendation;
        } catch(e) {
            alert('Error: ' + e.message);
        }
    }
</script>
</body>
</html>
