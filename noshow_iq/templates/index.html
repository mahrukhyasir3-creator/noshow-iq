<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoShowIQ - Patient Risk Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px 20px;
        }
        .container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2.5em; margin-bottom: 5px; }
        .header p { opacity: 0.8; font-size: 1.1em; }
        .form-container { padding: 30px; }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .form-group {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #3498db;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #3498db;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(52,152,219,0.4);
        }
        .btn:active { transform: translateY(0); }
        .result {
            margin: 20px 30px 30px;
            padding: 25px;
            border-radius: 15px;
            display: none;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .result.high {
            background: linear-gradient(135deg, #ff6b6b, #ee5a24);
            color: white;
        }
        .result.medium {
            background: linear-gradient(135deg, #ffd32a, #f79f1f);
            color: #2c3e50;
        }
        .result.low {
            background: linear-gradient(135deg, #0be881, #05c46b);
            color: #2c3e50;
        }
        .result h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .result .prob {
            font-size: 1.3em;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .result .rec {
            font-size: 1em;
            background: rgba(255,255,255,0.3);
            padding: 10px 15px;
            border-radius: 8px;
        }
        .loading {
            text-align: center;
            color: #3498db;
            font-size: 1.1em;
            display: none;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 NoShowIQ</h1>
            <p>Patient No-Show Risk Predictor</p>
        </div>

        <div class="form-container">
            <div class="form-grid">
                <div class="form-group">
                    <label>🎂 Patient Age</label>
                    <input type="number" id="age" value="35" min="0" max="120">
                </div>
                <div class="form-group">
                    <label>📅 Days in Advance</label>
                    <input type="number" id="days" value="7" min="0">
                </div>
                <div class="form-group">
                    <label>📱 SMS Received?</label>
                    <input type="number" id="sms" value="1" min="0" max="1">
                </div>
                <div class="form-group">
                    <label>❤️ Hypertension?</label>
                    <input type="number" id="hypertension" value="0" min="0" max="1">
                </div>
                <div class="form-group">
                    <label>🎓 Scholarship?</label>
                    <input type="number" id="scholarship" value="0" min="0" max="1">
                </div>
                <div class="form-group">
                    <label>🩺 Diabetes?</label>
                    <input type="number" id="diabetes" value="0" min="0" max="1">
                </div>
            </div>

            <button class="btn" onclick="predict()">
                🔍 Predict No-Show Risk
            </button>

            <div class="loading" id="loading">
                ⏳ Analyzing patient data...
            </div>
        </div>

        <div class="result" id="result">
            <h2 id="risk-text"></h2>
            <div class="prob" id="prob-text"></div>
            <div class="rec" id="rec-text"></div>
        </div>
    </div>

    <script>
        async function predict() {
            const loading = document.getElementById('loading');
            const result = document.getElementById('result');
            result.style.display = 'none';
            loading.style.display = 'block';

            const data = {
                age: parseInt(document.getElementById('age').value) || 30,
                days_in_advance: parseInt(document.getElementById('days').value) || 0,
                sms_received: parseInt(document.getElementById('sms').value) || 0,
                hypertension: parseInt(document.getElementById('hypertension').value) || 0,
                scholarship: parseInt(document.getElementById('scholarship').value) || 0,
                diabetes: parseInt(document.getElementById('diabetes').value) || 0,
            };

            try {
                const resp = await fetch('/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                const res = await resp.json();
                loading.style.display = 'none';

                const riskLevel = res.risk_level || 'low';
                const prob = res.no_show_probability || 0;
                const rec = res.recommendation || '';

                result.className = 'result ' + riskLevel;
                result.style.display = 'block';

                const emoji = riskLevel === 'high' ? '🚨' : riskLevel === 'medium' ? '⚠️' : '✅';
                document.getElementById('risk-text').innerText = emoji + ' ' + riskLevel.toUpperCase() + ' RISK';
                document.getElementById('prob-text').innerText = 'No-Show Probability: ' + (prob * 100).toFixed(1) + '%';
                document.getElementById('rec-text').innerText = '💡 ' + rec;

            } catch(e) {
                loading.style.display = 'none';
                alert('Connection error. Please try again.');
            }
        }
    </script>
</body>
</html>
