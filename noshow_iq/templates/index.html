<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NoShowIQ</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .header {
            background: linear-gradient(135deg, #0f3460, #e94560);
            color: white;
            padding: 25px;
            text-align: center;
        }
        .header h1 { font-size: 2em; }
        .header p { opacity: 0.85; margin-top: 5px; }
        .body { padding: 25px; }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .field {
            background: #f0f4ff;
            border-radius: 10px;
            padding: 12px;
            border-left: 4px solid #0f3460;
        }
        .field label {
            font-size: 0.8em;
            font-weight: bold;
            color: #0f3460;
            display: block;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
        }
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0f3460, #e94560);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn:hover { opacity: 0.9; }
        .result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
        }
        .result.high { background: #ff4757; color: white; }
        .result.medium { background: #ffa502; color: white; }
        .result.low { background: #2ed573; color: #1a1a1a; }
        .result h2 { font-size: 1.8em; margin-bottom: 8px; }
        .result .bar-wrap {
            background: rgba(255,255,255,0.3);
            border-radius: 20px;
            height: 20px;
            margin: 10px 0;
            overflow: hidden;
        }
        .result .bar {
            height: 100%;
            background: white;
            border-radius: 20px;
            transition: width 1s ease;
        }
        .result .prob { font-size: 1.1em; font-weight: bold; }
        .result .rec {
            margin-top: 10px;
            background: rgba(255,255,255,0.25);
            padding: 10px;
            border-radius: 8px;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>🏥 NoShowIQ</h1>
            <p>Patient No-Show Risk Predictor</p>
        </div>
        <div class="body">
            <div class="grid">
                <div class="field">
                    <label>🎂 Age (0-120)</label>
                    <input type="number" id="age" value="30" min="0" max="120">
                </div>
                <div class="field">
                    <label>📅 Days in Advance</label>
                    <input type="number" id="days" value="7" min="0">
                </div>
                <div class="field">
                    <label>📱 SMS Received (0/1)</label>
                    <input type="number" id="sms" value="1" min="0" max="1">
                </div>
                <div class="field">
                    <label>❤️ Hypertension (0/1)</label>
                    <input type="number" id="hypertension" value="0" min="0" max="1">
                </div>
                <div class="field">
                    <label>🎓 Scholarship (0/1)</label>
                    <input type="number" id="scholarship" value="0" min="0" max="1">
                </div>
                <div class="field">
                    <label>🩺 Diabetes (0/1)</label>
                    <input type="number" id="diabetes" value="0" min="0" max="1">
                </div>
            </div>

            <button class="btn" onclick="predict()">
                🔍 Predict No-Show Risk
            </button>

            <div class="result" id="result">
                <h2 id="risk-text"></h2>
                <div class="bar-wrap">
                    <div class="bar" id="bar"></div>
                </div>
                <div class="prob" id="prob-text"></div>
                <div class="rec" id="rec-text"></div>
            </div>
        </div>
    </div>

    <script>
        async function predict() {
            const btn = document.querySelector('.btn');
            btn.innerText = '⏳ Analyzing...';
            btn.disabled = true;

            const data = {
                age: parseInt(document.getElementById('age').value) || 30,
                days_in_advance: parseInt(document.getElementById('days').value) || 0,
                sms_received: parseInt(document.getElementById('sms').value) || 0,
                hypertension: parseInt(document.getElementById('hypertension').value) || 0,
                scholarship: parseInt(document.getElementById('scholarship').value) || 0,
                diabetes: parseInt(document.getElementById('diabetes').value) || 0,
                appointment_weekday: 2,
                alcoholism: 0,
                handicap: 0,
            };

            try {
                const resp = await fetch('/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });

                const res = await resp.json();
                const risk = res.risk_level || 'low';
                const prob = res.no_show_probability || 0;
                const rec = res.recommendation || '';

                const div = document.getElementById('result');
                div.className = 'result ' + risk;
                div.style.display = 'block';

                const emoji = risk === 'high' ? '🚨' : risk === 'medium' ? '⚠️' : '✅';
                document.getElementById('risk-text').innerText = emoji + ' ' + risk.toUpperCase() + ' RISK';
                document.getElementById('prob-text').innerText = 'No-Show Probability: ' + (prob * 100).toFixed(1) + '%';
                document.getElementById('rec-text').innerText = '💡 ' + rec;
                document.getElementById('bar').style.width = (prob * 100) + '%';

            } catch(e) {
                alert('Error connecting to server!');
            }

            btn.innerText = '🔍 Predict No-Show Risk';
            btn.disabled = false;
        }
    </script>
</body>
</html>
