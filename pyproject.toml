[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noshow_iq_66426"
version = "0.1.0"
description = "Patient no-show prediction API for clinics"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "pymongo>=4.6.0",
    "scikit-learn>=1.4.0",
    "pandas>=2.0.0",
    "imbalanced-learn>=0.12.0",
    "joblib>=1.3.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["noshow_iq*"]