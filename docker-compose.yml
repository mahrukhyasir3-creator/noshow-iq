version: "3.9"

services:
  app:
    build: .
    ports:
      - "7860:7860"
    environment:
      - MONGO_URI=mongodb://mongo:27017/noshow
      - MODEL_PATH=/app/noshow_model.joblib
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data: